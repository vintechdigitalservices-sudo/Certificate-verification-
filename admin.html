<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Panel - WeCare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif} 
body{background:#e6f5ea;color:#333;padding:20px} 
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px} 
h1{color:#28a745;margin:0;font-size:1.4rem} 
.actions{display:flex;gap:8px;align-items:center} 
.btn{padding:8px 12px;border-radius:6px;border:2px solid #001f54;background:#28a745;color:#fff;cursor:pointer;transition:.2s} 
.btn.ghost{background:transparent;color:#fff;border-color:#fff} 
.btn.warn{background:#ffc107;border:none;color:#111} 
.btn.danger{background:#dc3545;border:none;color:#fff} 
form{background:#fff;padding:18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);margin-bottom:22px} 
form .row{display:flex;gap:12px;margin-bottom:10px} 
form .col{flex:1} 
label{display:block;margin-bottom:6px;font-size:13px;color:#333} 
input[type="text"],select,input[type="search"]{width:100%;padding:10px 12px;border-radius:6px;border:1px solid #ccc;font-size:14px} 
.small{width:160px} 
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.08);border:1px solid #ccc} 
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #ccc;border-right:1px solid #ccc;vertical-align:middle} 
th:last-child, td:last-child{border-right:none} 
th{background:#28a745;color:#fff;font-weight:600} 
tr:hover{background:#fafafa} 
.passport{width:90px;height:110px;object-fit:cover;border-radius:6px;border:2px solid #ccc;display:block} 
td .no-photo{width:90px;height:110px;border-radius:6px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;border:2px dashed #e2e8f0} 
.meta{font-size:13px;color:#666} 
.status-Verified{color:green;font-weight:600} 
.status-NotVerified{color:#d9534f;font-weight:600} 
.top-controls{display:flex;gap:8px;align-items:center;margin-bottom:12px} 
input[type="search"]{padding:8px 12px;border-radius:6px;border:1px solid #ccc} 
footer{margin-top:18px;font-size:12px;color:#555;text-align:center} 
@media (max-width:900px){form .row{flex-direction:column}.small{width:100%}th,td{font-size:13px;padding:8px}td img.passport{width:70px;height:85px}.no-photo{width:70px;height:85px}}
</style>
</head>
<body>

<header>
  <h1>Admin Panel — WeCare</h1>
  <div class="actions">
    <input type="search" id="searchInput" placeholder="Search by name or course code" />
    <button class="btn" id="logoutBtn">Logout</button>
  </div>
</header>

<form id="studentForm">
  <h2 style="margin-bottom:10px;color:#28a745;">Add / Edit Student</h2>
  <div class="row">
    <div class="col"><label for="firstName">First Name *</label><input id="firstName" type="text" placeholder="First name" required></div>
    <div class="col"><label for="lastName">Last Name *</label><input id="lastName" type="text" placeholder="Last name" required></div>
  </div>
  <div class="row">
    <div class="col"><label for="otherName">Other Name</label><input id="otherName" type="text" placeholder="Other name (optional)"></div>
    <div class="col"><label for="course">Course *</label><input id="course" type="text" placeholder="Course (e.g., Basic Nursing)" required></div>
  </div>
  <div class="row">
    <div class="col"><label for="field">Field / Department</label><input id="field" type="text" placeholder="Field or department (optional)"></div>
    <div class="col small"><label for="certId">Course Code *</label><input id="certId" type="text" placeholder="Unique course code" required></div>
  </div>
  <div class="row">
    <div class="col small"><label for="status">Status *</label><select id="status" required><option value="Verified">Verified</option><option value="Not Verified">Not Verified</option></select></div>
    <div class="col small"><label for="gradDate">Graduation Date *</label><input id="gradDate" type="text" placeholder="YYYY-MM-DD" required></div>
    <div class="col small"><label for="issueDate">Certificate Issue Date</label><input id="issueDate" type="text" placeholder="YYYY-MM-DD"></div>
  </div>
  <div style="display:flex; gap:8px; align-items:center; margin-top:12px;">
    <button class="btn" type="submit" id="submitBtn">Submit</button>
    <button type="button" id="resetBtn" style="background:#fff;border:2px solid #001f54;color:#001f54;padding:8px 12px;border-radius:6px;cursor:pointer;">Reset</button>
    <div style="margin-left:auto" class="meta">Tip: Course Code is used as document ID</div>
  </div>
</form>

<h2 style="margin-bottom:10px;color:#28a745;">All Students</h2>
<table id="studentsTable" aria-live="polite">
<thead>
<tr>
<th style="width:110px">Photo</th>
<th>Full Name</th>
<th>Course / Field</th>
<th>Course Code</th>
<th>Status</th>
<th>Graduation Date</th>
<th>Certificate Issue Date</th>
<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>

<footer>&copy; 2025 WeCare Nursing Services — Admin Panel</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBIM_jh15J2riP1XXtxP4hCmlbx1BqK5-8",
  authDomain:"wecare--verification.firebaseapp.com",
  projectId:"wecare--verification",
  storageBucket:"wecare--verification.appspot.com",
  messagingSenderId:"198997154830",
  appId:"1:198997154830:web:a732dc7abc306ed1a5f05f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const firstNameEl=document.getElementById('firstName'),
      lastNameEl=document.getElementById('lastName'),
      otherNameEl=document.getElementById('otherName'),
      courseEl=document.getElementById('course'),
      fieldEl=document.getElementById('field'),
      certIdEl=document.getElementById('certId'),
      statusEl=document.getElementById('status'),
      gradDateEl=document.getElementById('gradDate'),
      issueDateEl=document.getElementById('issueDate'),
      submitBtn=document.getElementById('submitBtn'),
      studentsTableBody=document.querySelector('#studentsTable tbody'),
      searchInput=document.getElementById('searchInput'),
      logoutBtn=document.getElementById('logoutBtn'),
      resetBtn=document.getElementById('resetBtn');

let editingCertId=null;

onAuthStateChanged(auth,user=>{
  if(!user || user.email!=="academy@wecarenigeria.com") window.location.href="admin-login.html";
});

logoutBtn.addEventListener('click', async()=>{
  await signOut(auth);
  window.location.href="admin-login.html";
});

async function loadStudents(filter=''){
  studentsTableBody.innerHTML='';
  try{
    const snapshot=await getDocs(collection(db,"students"));
    const rows=[];
    snapshot.forEach(docSnap=>{
      const d=docSnap.data();
      const student={
        firstName: d.firstName||'',
        lastName: d.lastName||'',
        otherName: d.otherName||'',
        fullName: d.fullName || `${d.firstName||''} ${d.otherName||''} ${d.lastName||''}`.trim(),
        course: d.course||'-',
        field: d.field||'-',
        certId: d.certId || docSnap.id,
        status: d.status||'Not Verified',
        gradDate: d.gradDate||'-',
        issueDate: d.issueDate||'-',
        imageURL: d.imageURL||''
      };
      const searchable=`${student.firstName} ${student.lastName} ${student.otherName} ${student.certId}`.toLowerCase();
      if(!filter||searchable.includes(filter.toLowerCase())) rows.push(student);
    });

    if(rows.length===0){
      studentsTableBody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:18px;color:#666">No students found.</td></tr>`;
    }

    rows.sort((a,b)=>a.certId.localeCompare(b.certId));

    rows.forEach(s=>{
      const tr=document.createElement('tr');
      const imgHtml = s.imageURL ? `<img class="passport" src="${escapeHtml(s.imageURL)}" alt="Photo">` : `<div class="no-photo">No photo</div>`;
      const statusClass = s.status.replace(/\s/g,'');
      tr.innerHTML = `
        <td>${imgHtml}</td>
        <td>${escapeHtml(s.fullName)}</td>
        <td><div style="font-weight:600">${escapeHtml(s.course)}</div><div class="meta">${escapeHtml(s.field)}</div></td>
        <td>${escapeHtml(s.certId)}</td>
        <td class="status-${escapeHtml(statusClass)}">${escapeHtml(s.status)}</td>
        <td>${escapeHtml(s.gradDate)}</td>
        <td>${escapeHtml(s.issueDate)}</td>
        <td>
          <button class="btn warn" onclick="editStudent('${escapeJs(s.certId)}')">Edit</button>
          <button class="btn danger" onclick="deleteStudent('${escapeJs(s.certId)}')">Delete</button>
        </td>
      `;
      studentsTableBody.appendChild(tr);
    });
  }catch(e){console.error(e); studentsTableBody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:18px;color:#d9534f">Error loading students.</td></tr>`;}
}

document.getElementById('studentForm').addEventListener('submit', async e=>{
  e.preventDefault();
  submitBtn.disabled = true;
  const originalText = submitBtn.textContent;
  submitBtn.textContent = "Processing...";

  // FORCING UPPERCASE FOR CONSISTENCY WITH VERIFICATION PORTAL
  const finalCertId = certIdEl.value.trim().toUpperCase();

  const student={
    certId: finalCertId,
    firstName: firstNameEl.value.trim(),
    lastName: lastNameEl.value.trim(),
    otherName: otherNameEl.value.trim(),
    fullName: `${firstNameEl.value.trim()} ${otherNameEl.value.trim()} ${lastNameEl.value.trim()}`.trim(),
    course: courseEl.value.trim(),
    field: fieldEl.value.trim(),
    status: statusEl.value,
    gradDate: gradDateEl.value.trim(),
    issueDate: issueDateEl.value.trim(),
    createdAt: new Date().toISOString(),
    imageURL: ''
  };

  if(!student.firstName||!student.lastName||!student.course||!student.gradDate||!student.certId){
    alert('Please fill required fields.');
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
    return;
  }

  try{
    // USING finalCertId AS DOCUMENT REFERENCE
    await setDoc(doc(db,"students",finalCertId),student);
    alert('Student saved successfully.');
    document.getElementById('studentForm').reset();
    certIdEl.disabled=false; editingCertId=null;
    loadStudents(searchInput.value.trim());
  }catch(e){console.error(e); alert('Error saving student.');}
  
  submitBtn.disabled = false;
  submitBtn.textContent = originalText;
});

window.editStudent = async certId=>{
  try{
    const docSnap = await getDoc(doc(db,"students",certId));
    if(!docSnap.exists()){alert('Record not found.'); return;}
    const s=docSnap.data();
    firstNameEl.value = s.firstName||'';
    lastNameEl.value = s.lastName||'';
    otherNameEl.value = s.otherName||'';
    courseEl.value = s.course||'';
    fieldEl.value = s.field||'';
    certIdEl.value = s.certId;
    certIdEl.disabled = true;
    statusEl.value = s.status||'Not Verified';
    gradDateEl.value = s.gradDate||'';
    issueDateEl.value = s.issueDate||'';
    editingCertId = certId;
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){console.error(e); alert('Error loading student.');}
};

window.deleteStudent = async certId=>{
  if(!confirm('Are you sure you want to delete this student?')) return;
  try{
    await deleteDoc(doc(db,"students",certId));
    alert('Student deleted.');
    loadStudents(searchInput.value.trim());
  }catch(e){console.error(e); alert('Error deleting student.');}
};

searchInput.addEventListener('input', ()=>loadStudents(searchInput.value.trim()));
resetBtn.addEventListener('click', ()=>{document.getElementById('studentForm').reset(); certIdEl.disabled=false; editingCertId=null;});

function escapeHtml(str){if(!str && str!=='') return''; return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeJs(str){if(!str && str!=='') return''; return String(str).replace(/'/g,"\\'").replace(/"/g,'\\"');}

loadStudents();
</script>
</body>
</html>
